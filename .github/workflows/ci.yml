name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r haliday_show/requirements.txt pytest pytest-aiohttp
      - run: python -m pytest -q
      - run: node --test tests/js/*.mjs
      - name: Installs and runs with pipx
        run: |
          pipx install .
          haliday-show < /dev/null &
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:8099/api/info && break; sleep 1; done
          curl -fsS localhost:8099/api/info
          curl -fsS -o /dev/null localhost:8099/static/js/app.js
          test -d ~/haliday-show/config
          kill %1
      - name: Versions match
        run: |
          v_py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          v_addon=$(sed -n 's/^version: "\(.*\)"/\1/p' haliday_show/config.yaml)
          v_pkg=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' haliday_show/app/halidayshow/__init__.py)
          echo "pyproject=$v_py config.yaml=$v_addon package=$v_pkg"
          [ "$v_py" = "$v_addon" ] && [ "$v_py" = "$v_pkg" ]

  image:
    # Build the add-on the way the Supervisor does, so a bad base image fails here, not in HA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_ARCH=amd64 -t haliday-show-test haliday_show
      - name: Starts and serves the editor
        run: |
          docker run -d --name gs -e HALIDAY_SHOW_ALLOW_ALL=1 -e HALIDAY_SHOW_CONFIG=/tmp/c -e HALIDAY_SHOW_MEDIA=/tmp/m -p 8099:8099 haliday-show-test
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:8099/api/info && break; sleep 1; done
          docker logs gs
          # 200 (not 403) also proves the container's environment reaches the app.
          curl -fsS localhost:8099/api/info
      - name: Runs standalone, as the compose file does
        run: |
          docker compose -f standalone/docker-compose.yml config -q
          docker run -d --name solo --network host -e HALIDAY_SHOW_PORT=8098 -e HALIDAY_SHOW_PASSWORD=pw \
            -e HALIDAY_SHOW_CONFIG=/tmp/c -e HALIDAY_SHOW_MEDIA=/tmp/m haliday-show-test
          ip=$(hostname -I | awk '{print $1}')
          for i in $(seq 1 20); do curl -s -o /dev/null "$ip:8098/" && break; sleep 1; done
          docker logs solo
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$ip:8098/api/info")" = 401 ]
          curl -fsS -u any:pw "$ip:8098/api/info"
      - name: aarch64 base image exists
        run: |
          base=$(sed -n 's/^FROM \(.*\)$/\1/p' haliday_show/Dockerfile | sed 's/${BUILD_ARCH}/aarch64/')
          docker manifest inspect "$base" > /dev/null
