name: Govee Light Show
version: "0.1.0"
slug: govee_show
description: Create, preview and play music-synchronised Govee light shows.
url: https://github.com/gavin-vbmedia/govee-ha-show
arch:
  - aarch64
  - amd64
init: false
# Govee LAN control uses UDP multicast discovery, which needs the host network.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:string-lights
panel_title: Light Show
homeassistant_api: true
map:
  - media:rw
  - share:rw
