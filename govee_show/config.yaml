name: Govee Light Show
version: "0.2.0"
slug: govee_show
description: Create, preview and play music-synchronised Govee light shows.
url: https://github.com/gavin-vbmedia/govee-ha-show
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Govee LAN control uses UDP multicast discovery and fixed ports, which need the host network.
# The web server only answers the ingress proxy, so the port isn't open to the LAN.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:string-lights
panel_title: Light Shows
homeassistant_api: true
map:
  - media:ro        # songs from the Home Assistant media folder
  - addon_config:rw # shows, devices and uploaded songs (included in backups)
