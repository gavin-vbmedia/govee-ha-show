name: HA-liday Show
version: "0.2.89"
slug: haliday_show
description: Create, preview and play music-synchronised light shows (formerly Govee Light Show).
url: https://github.com/gavin-vbmedia/ha-liday-show
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Govee LAN control uses UDP multicast discovery and fixed ports, which need the host network.
# The web server only answers the ingress proxy, so the port isn't open to the LAN.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:string-lights
panel_title: HA-liday Show
homeassistant_api: true
# Automations can send commands with the hassio.addon_stdin action.
stdin: true
# Show entities (select, play/stop buttons, status) via MQTT discovery when a broker exists.
services:
  - mqtt:want
# Optional AI: a Claude API key, or else Home Assistant's AI Task (pick an entity if there are several).
options:
  claude_api_key: ""
  ai_task_entity: ""
schema:
  claude_api_key: password?
  ai_task_entity: str?
map:
  - media:rw        # songs; uploads go to /media/haliday_show so media players can play them
  - addon_config:rw # shows, devices and settings (included in backups)
  - all_addon_configs:ro # read once on first start, to bring data across from Govee Light Show
