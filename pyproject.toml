# Development tooling only. The add-on version lives in haliday_show/config.yaml and
# haliday_show/app/halidayshow/__init__.py; CI checks they match this one.
[project]
name = "haliday-show"
version = "0.2.92"
requires-python = ">=3.12"
dependencies = ["aiohttp"]

[tool.pytest.ini_options]
pythonpath = ["haliday_show/app"]
testpaths = ["tests"]
asyncio_mode = "auto"  # pytest-aiohttp runs the async tests
